[package]
name = "hook"
version = "0.1.1"
edition = "2021"
authors = ["Dirk Beukes"]
description = "Capture, inspect and replay webhooks to localhost."
license = "MIT"
repository = "https://github.com/Stoffbergie/hook"
keywords = ["cli", "webhooks", "replay", "localhost"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

